services:
  db:
    image: postgres:17-alpine
    container_name: srs_postgresdb
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: srs_db
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d srs_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: srs_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: redis-server --requirepass streamserve --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 10s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: srs_supertokens
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3567:3567'
    environment:
      POSTGRESQL_CONNECTION_URI: 'postgresql://user:password@db:5432/srs_db'
      POSTGRESQL_TABLE_NAMES_PREFIX: 'supertokens'
    healthcheck:
      test: >
        bash -c "exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e 'GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep 'Hello'"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

networks:
  srs_network:
    driver: bridge
